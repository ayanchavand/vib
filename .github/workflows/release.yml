name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Prepare binary artifact
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/vib.exe staging/vib.exe
          else
            cp target/release/vib staging/vib
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vib-${{ matrix.os }}
          path: staging/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Release Archives
        run: |
          mkdir -p release-assets
          if [ -d "artifacts/vib-ubuntu-latest" ]; then
            tar -czvf release-assets/vib-linux.tar.gz -C artifacts/vib-ubuntu-latest vib
          fi
          if [ -d "artifacts/vib-macos-latest" ]; then
            tar -czvf release-assets/vib-macos.tar.gz -C artifacts/vib-macos-latest vib
          fi
          if [ -d "artifacts/vib-windows-latest" ]; then
            zip -j release-assets/vib-windows.zip artifacts/vib-windows-latest/vib.exe
          fi

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true


